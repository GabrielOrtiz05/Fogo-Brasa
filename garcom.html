<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Garçom - Fogo & Brasa</title>
    <link rel="stylesheet" href="/css/perfil-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="dashboard-header">
        <div class="container header-flex">
            <h1 class="logo">Área do <span>Staff</span></h1>
            <div class="user-info">
                <span id="nome-garcom" style="color: var(--primary-orange); font-weight: bold;">Carregando...</span>
                <button onclick="logout()" class="btn-logout">Sair</button>
            </div>
        </div>
    </header>

    <main class="container" style="margin-top: 40px;">
        <h2>Gestão de Mesas e Pedidos</h2>
        
        <div id="painel-pedidos" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;">
            <p class="empty-msg">Carregando pedidos ativos...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/script/garcom-script.js"></script>
</body>
</html>
