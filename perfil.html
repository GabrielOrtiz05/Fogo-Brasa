<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Pedido - Fogo & Brasa</title>
    <link rel="stylesheet" href="/css/perfil-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="dashboard-header">
        <div class="container header-flex">
            <a href="index.html" class="logo" style="text-decoration: none;">Fogo<span>&</span>Brasa</a>
            
            <div class="user-info" style="display: flex; align-items: center; gap: 15px;">
                <a href="index.html" style="color: var(--text-gray); text-decoration: none; font-size: 0.9rem; transition: 0.3s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--text-gray)'">← Início</a>
                
                <span id="boas-vindas">Carregando perfil...</span>
                <button onclick="logout()" class="btn-logout">Sair</button>
            </div>
        </div>
    </header>

    <main class="container dashboard-main">
        <section class="menu-section">
            <h2>Cardápio de Cortes</h2>
            <div class="menu-grid">
                <div class="item-card">
                    <div class="item-info">
                        <h3>Picanha Premium</h3>
                        <p>R$ 89,90</p>
                    </div>
                    <button onclick="adicionarAoPedido('Picanha Premium', 89.90)" class="btn-add">+</button>
                </div>
                <div class="item-card">
                    <div class="item-info">
                        <h3>Costela Fogo de Chão</h3>
                        <p>R$ 75,00</p>
                    </div>
                    <button onclick="adicionarAoPedido('Costela Fogo de Chão', 75.00)" class="btn-add">+</button>
                </div>
                <div class="item-card">
                    <div class="item-info">
                        <h3>Bife de Ancho</h3>
                        <p>R$ 95,00</p>
                    </div>
                    <button onclick="adicionarAoPedido('Bife de Ancho', 95.00)" class="btn-add">+</button>
                </div>
            </div>
        </section>
<aside class="order-summary">
            <h3>Seu Pedido</h3>
            <ul id="lista-pedido">
                <p class="empty-msg">Nenhum item selecionado</p>
            </ul>
            
            <div style="margin-top: 15px; margin-bottom: 10px;">
                <label for="numero-mesa" style="font-size: 0.9rem; color: var(--text-gray);">Número da Mesa (obrigatório):</label>
                <input type="number" id="numero-mesa" min="1" max="100" placeholder="Ex: 5" style="width: 100%; padding: 10px; margin-top: 5px; background: #121212; color: white; border: 1px solid #444; border-radius: 4px; font-family: 'Poppins', sans-serif;">
            </div>

            <div class="total-box">
                <span>Total:</span>
                <span id="valor-total">R$ 0,00</span>
            </div>
            <button id="btn-finalizar" onclick="finalizarPedido()" class="btn-primary" disabled>Finalizar Pedido</button>
            <a href="index.html" class="btn-return">Voltar para o Início</a>
        </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/script/perfil-script.js"></script>
</body>
</html>
