version: '3.8'

services:
  db:
    image: postgres:16
    container_name: churrascaria-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: suasenha
      POSTGRES_DB: churrascaria
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: churrascaria-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata: